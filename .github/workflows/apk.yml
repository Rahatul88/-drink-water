name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        run: |
          mkdir -p www && cp index.html www/
          echo '{"appId":"com.yourname.drinkingwater","appName":"Drinking Water","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm i @capacitor/core @capacitor/android @capacitor/local-notifications
          npm i -D @capacitor/cli
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: drinking-water-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
